<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>QC Dashboard Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F6;--sf:#fff;--ink:#0E2430;--mu:#566B76;--ln:#D3DDE1;--nv:#0B2A3A;--yl:#F2B705;--tl:#0F7479;--ok:#1B6E44;--okb:#DDF1E5;--wn:#8A5300;--wnb:#FBE9C6;--bd:#A8231B;--bdb:#FADDDA;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#091820;--sf:#10262F;--ink:#E6EFF2;--mu:#93AAB4;--ln:#24414D;--nv:#051117;--tl:#4FC3C8;--ok:#6FD3A0;--okb:#123626;--wn:#F0B955;--wnb:#3A2A0B;--bd:#FF9B92;--bdb:#3F1815;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#091820;--sf:#10262F;--ink:#E6EFF2;--mu:#93AAB4;--ln:#24414D;--nv:#051117;--tl:#4FC3C8;--ok:#6FD3A0;--okb:#123626;--wn:#F0B955;--wnb:#3A2A0B;--bd:#FF9B92;--bdb:#3F1815;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--nv);z-index:10}
h1,h2,h3,.pid,.plate b{font-family:"Barlow Semi Condensed",Barlow,system-ui,sans-serif;margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tl);outline-offset:2px}
.bar{background:var(--nv);color:#fff;display:flex;align-items:center;gap:12px;min-height:56px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.bar h1{font-size:20px;font-weight:700;letter-spacing:.2px;flex:1}
#back{background:none;border:0;color:var(--yl);font-weight:600;min-height:44px;padding:0 4px;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
label.big{display:block;font-weight:600;font-size:18px;margin-bottom:8px}
.field{display:flex;align-items:stretch;background:var(--sf);border:2px solid var(--ln);border-radius:14px;overflow:hidden}
.field:focus-within{border-color:var(--tl)}
.field b{background:var(--yl);color:#0B2A3A;font-size:34px;font-weight:700;display:flex;align-items:center;padding:0 18px}
.field input{flex:1;min-width:0;border:0;background:transparent;font-size:32px;font-weight:600;padding:12px 14px;font-family:"Barlow Semi Condensed",Barlow,sans-serif}
.field input:focus{outline:0}
.hint{color:var(--mu);font-size:15px;margin:8px 2px 18px}
.sug{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:8px;min-height:60px;color:inherit;text-decoration:none}
.sug b{font:700 26px "Barlow Semi Condensed",Barlow,sans-serif;min-width:62px}
.sug span{flex:1;color:var(--mu)}
h2{font-size:19px;font-weight:700;margin:22px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.qc{background:var(--sf);border:1px solid var(--ln);border-radius:10px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:inherit;text-decoration:none;font:700 21px "Barlow Semi Condensed",Barlow,sans-serif}
.qc small{font:500 12px Barlow,sans-serif;color:var(--bd)}
.asof{color:var(--mu);font-size:14px;margin-top:28px}
.plate{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.pid{background:var(--yl);color:#0B2A3A;font-size:44px;font-weight:700;line-height:1;padding:8px 16px;border-radius:10px}
.plate .fl{font-size:20px;font-weight:600;margin-bottom:4px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;overflow-x:auto;background:var(--bg);margin:0 -16px 14px;padding:8px 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--ln);background:var(--sf);font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--nv);color:#fff;border-color:var(--nv)}
:root[data-theme="dark"] .tabs button[aria-selected="true"]{background:var(--yl);color:#0B2A3A;border-color:var(--yl)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button[aria-selected="true"]{background:var(--yl);color:#0B2A3A;border-color:var(--yl)}}
.tabs small{opacity:.7;margin-left:6px;font-weight:500}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.card h3{font-size:19px;font-weight:700;line-height:1.25;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{display:inline-block;font-size:14px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--ln)}
.chip.ok{background:var(--okb);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--wnb);color:var(--wn);border-color:transparent}
.chip.bad{background:var(--bdb);color:var(--bd);border-color:transparent}
dl{margin:0}
.kv{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-top:1px solid var(--ln)}
.kv:first-child{border-top:0}
dt{color:var(--mu);flex:none}
dd{margin:0;text-align:right;overflow-wrap:anywhere}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.seg button{flex:1 1 22%;min-width:84px;padding:0 6px;font-size:15px;min-height:46px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{border:2px solid var(--tl);color:var(--tl)}
.more{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);font-weight:600;cursor:pointer}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{text-align:left;padding:9px 6px;border-top:1px solid var(--ln);white-space:nowrap}
th{color:var(--mu);font-weight:500;border-top:0}
.empty,.note{color:var(--mu);text-align:center;padding:24px 8px}
.note{padding:8px;font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.btn{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);font-weight:600;cursor:pointer}
.btn.pri{background:var(--nv);color:#fff;border-color:var(--nv)}
:root[data-theme="dark"] .btn.pri{background:var(--yl);color:#0B2A3A;border-color:var(--yl)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{background:var(--yl);color:#0B2A3A;border-color:var(--yl)}}
#exone{margin-bottom:6px}
.msg{font-size:15px;margin:0 2px 14px;color:var(--mu)}
.msg:empty{display:none}
.msg.ok{color:var(--ok)}
.msg.bad{color:var(--bd)}
.upd{font-size:15px;color:var(--mu);margin:0 2px 14px}
.upd b{color:var(--ink)}
.plate .upd{margin:4px 0 0;font-size:14px}
.hero{position:relative;overflow:hidden;border-radius:16px;margin-bottom:16px;padding:18px 16px 14px;min-height:310px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:#0B2A3A}
.hero>:not(.scene){position:relative}
.scene{position:absolute;inset:0;width:100%;height:100%}
.hero h2{margin:0;font-size:27px;line-height:1.1;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.hero label.big{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.hero .hint{color:#D8E6EC;margin:8px 2px 0;text-shadow:0 1px 6px rgba(0,0,0,.6)}
/* ===== QC Dashboard Status: styles on top of the base palette =====
   Layout: a short Home (3D hero, search, summary cards). Every card opens its own page with the full detail.
   Phone: bottom navigation bar. Desktop: navigation in the header. */
:root{--sh:0 1px 2px rgba(14,36,48,.05),0 10px 28px -18px rgba(14,36,48,.35);--glow:rgba(15,116,121,.10);--otl:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sh:0 1px 0 rgba(255,255,255,.03) inset,0 14px 34px -20px rgba(0,0,0,.9);--glow:rgba(79,195,200,.09);--otl:#06222A}}
:root[data-theme="dark"]{--sh:0 1px 0 rgba(255,255,255,.03) inset,0 14px 34px -20px rgba(0,0,0,.9);--glow:rgba(79,195,200,.09);--otl:#06222A}
body{background:var(--bg) radial-gradient(900px 480px at 100% -10%,var(--glow),transparent 70%) no-repeat;transition:background-color .3s,color .3s}
main{max-width:1120px;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
a{color:var(--tl)}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);border:0;white-space:nowrap}

/* ---------- header and navigation ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(90deg,#0B2A3A,#0F3B4F 60%,#12495C);box-shadow:0 2px 14px rgba(5,17,23,.35)}
.bar .brand{display:flex;flex:none;border-radius:8px}
.bar .logo{width:30px;height:30px;display:block}
.bar h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#back{flex:none;white-space:nowrap}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;background:#0C2D3E;border-top:1px solid rgba(255,255,255,.12);box-shadow:0 -8px 24px rgba(5,17,23,.28);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:50px;padding:4px 2px;border-radius:12px;color:#A9C2CC;text-decoration:none;font:600 12px Barlow,system-ui,sans-serif;transition:background .2s,color .2s}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{color:#fff}
.nav a[aria-current="page"]{color:#fff;background:rgba(255,255,255,.11)}
.nav a[aria-current="page"] svg{color:#F2B705}
.nav a:focus-visible{outline-color:#F2B705}
.nav .badge{position:absolute;top:1px;left:calc(50% + 5px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#D93A2F;color:#fff;font:700 11px/18px Barlow,system-ui,sans-serif;text-align:center}
.thm{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px 0 10px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;font:600 14px Barlow,system-ui,sans-serif;cursor:pointer;transition:background .2s,transform .12s;flex:none}
.thm:hover{background:rgba(255,255,255,.16)}
.thm:active{transform:scale(.96)}
.thm svg{width:18px;height:18px;color:#F2B705}
.thm .i-sun{display:none}
.thm.is-dark .i-sun{display:block}
.thm.is-dark .i-moon{display:none}
@media (max-width:899px){#back:not([hidden])+.brand{display:none}}
@media (max-width:420px){.thm span{display:none}.thm{padding:0 11px}}
@media (min-width:900px){
  main{padding-bottom:40px}
  .nav{position:static;display:flex;gap:2px;background:none;border:0;box-shadow:none;padding:0;flex:none}
  .nav a{flex-direction:row;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;font-size:15px}
  .nav svg{width:18px;height:18px}
  .nav .badge{position:static;margin-left:-2px}
}

/* ---------- 3D hero and crane banner ---------- */
.hero{min-height:420px;border-radius:20px;padding:18px 16px 16px;margin:0 0 14px;box-shadow:0 22px 44px -22px rgba(5,17,23,.75);isolation:isolate}
.hero>.gl,.hero>.shade,.banner>.gl,.banner>.shade{position:absolute;inset:0}
.hero>.drag,.banner>.drag{position:absolute;top:12px;right:12px}
.gl canvas{display:block;width:100%!important;height:100%!important;touch-action:pan-y;cursor:grab;outline:0}
.gl canvas:active{cursor:grabbing}
.scene{transition:opacity .9s}
.has-gl>.scene{opacity:0}
.gl{opacity:0;transition:opacity .9s}
.has-gl>.gl{opacity:1}
.shade{pointer-events:none;background:linear-gradient(180deg,rgba(5,17,23,.6) 0,rgba(5,17,23,0) 26%,rgba(5,17,23,0) 52%,rgba(5,17,23,.82) 100%)}
.hero .top{pointer-events:none}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:600 12px Barlow,system-ui,sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:#F2B705;margin-bottom:6px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.eyebrow::before{content:"";width:18px;height:2px;background:#F2B705;border-radius:2px}
.hero h2{font-size:30px;text-wrap:balance}
.hero form{background:rgba(8,26,35,.52);-webkit-backdrop-filter:blur(10px) saturate(140%);backdrop-filter:blur(10px) saturate(140%);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:12px 12px 10px}
.hero .field{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.94);color:#0E2430}
.hero .field input{color:#0E2430}
.hero .field input::placeholder{color:#8AA0AA}
.drag{display:none;pointer-events:none;font:600 12px Barlow,system-ui,sans-serif;color:#E6EFF2;background:rgba(8,26,35,.5);border:1px solid rgba(255,255,255,.18);padding:4px 10px;border-radius:999px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.has-gl>.drag{display:block}
.banner{position:relative;overflow:hidden;border-radius:20px;height:270px;margin-bottom:14px;color:#fff;isolation:isolate;background:radial-gradient(120% 90% at 70% 100%,#F0B35C 0,#1F6070 48%,#0A2433 100%);box-shadow:0 22px 44px -22px rgba(5,17,23,.75)}
.banner .plate{position:absolute;left:14px;right:14px;bottom:12px;margin:0;pointer-events:none;align-items:flex-end}
.banner .plate .fl{text-shadow:0 1px 8px rgba(0,0,0,.6)}
.banner .plate .upd{color:#D8E6EC;margin:4px 0 0;font-size:14px}
.banner .pid{box-shadow:0 6px 18px -6px rgba(0,0,0,.6)}
.mode{display:inline-flex;align-items:center;gap:6px;font:600 13px Barlow,system-ui,sans-serif;margin-left:6px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.mode i{width:8px;height:8px;border-radius:50%;background:#3BE07A}
.mode.down i{background:#FF5A4F;animation:blink 1.2s infinite}
#dhead>.btn{margin-bottom:10px}

/* ---------- shared pieces ---------- */
.card{border-radius:16px;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.card.flat{padding:4px 16px;overflow-x:auto}
.card.crit-1{border-left:4px solid var(--bd)}
.card.crit-2{border-left:4px solid var(--wn)}
.card.crit-3{border-left:4px solid var(--ok)}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}
label.btn{display:inline-flex;align-items:center;justify-content:center}
.btn.pri,a.btn.pri{color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0B2A3A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0B2A3A}}
.btn:active,.more:active{transform:scale(.98)}
.tools{position:relative}
.empty-state p{margin:0 0 12px;color:var(--mu);max-width:60ch}
.empty-state b{color:var(--ink)}
.empty-state .tools{margin:0 0 6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;flex:none}
.s-ok{background:var(--ok)}.s-wn{background:var(--wn)}.s-bd{background:var(--bd)}.s-mu{background:var(--ln)}.s-tl{background:var(--tl)}
.s-pd{background:var(--wnb);box-shadow:inset 0 0 0 1px var(--wn)}.s-no{background:var(--bg);box-shadow:inset 0 0 0 1px var(--ln)}
.meter{display:flex;height:10px;border-radius:99px;background:var(--bg);overflow:hidden;box-shadow:inset 0 0 0 1px var(--ln)}
.meter i{display:block;width:var(--w);height:100%;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) .2s backwards}
.meter i+i{box-shadow:-1px 0 0 var(--sf)}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:13px;color:var(--mu)}
.lg span{display:inline-flex;align-items:center;gap:5px}
.lg i{width:9px;height:9px;border-radius:2px}
.lg b{color:var(--ink);font-variant-numeric:tabular-nums}
.rt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;margin-bottom:5px}
.rt span{font-weight:600;display:inline-flex;align-items:center}
.rt b{font-variant-numeric:tabular-nums;color:var(--mu);font-weight:600}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}
.ring .trk{stroke:var(--bdb)}
.ring .val{stroke:var(--ok);stroke-linecap:round;stroke-dasharray:var(--c);stroke-dashoffset:var(--o);animation:ring 1.3s cubic-bezier(.2,.8,.2,1) .15s backwards}
.rc{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;text-align:center}
.rc b{font:700 34px/1 "Barlow Semi Condensed",Barlow,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.rc small{font:700 16px "Barlow Semi Condensed",Barlow,system-ui,sans-serif;align-self:flex-start;margin-top:3px}
.rc span{flex-basis:100%;font-size:12px;color:var(--mu);margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpis div{display:flex;flex-direction:column;gap:2px;padding-left:10px;border-left:3px solid var(--ln);min-width:0}
.kpis div.k-bad{border-left-color:var(--bd)}
.kpis b{font:700 28px/1 "Barlow Semi Condensed",Barlow,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.kpis span{font-size:13px;color:var(--mu);line-height:1.2}
.more{box-shadow:var(--sh);margin-top:8px;transition:border-color .2s,transform .12s}
.more:hover{border-color:var(--tl)}

/* ---------- Home: summary cards ---------- */
#sug:not(:empty){margin-bottom:14px}
.sug{transition:transform .18s,box-shadow .18s,border-color .18s;animation:rise .3s backwards;box-shadow:var(--sh)}
.sug:hover{transform:translateY(-2px);border-color:var(--tl)}
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sc{position:relative;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px 14px 12px;color:inherit;text-decoration:none;box-shadow:var(--sh);transition:transform .18s,border-color .18s;animation:rise .45s backwards;animation-delay:calc(var(--i,0)*45ms)}
.sc:hover{transform:translateY(-2px);border-color:var(--tl)}
.sc:active{transform:scale(.98)}
.sc .sl{display:flex;align-items:center;font:600 12px Barlow,system-ui,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:var(--mu);padding-right:16px}
.sc .sn{font:700 34px/1.05 "Barlow Semi Condensed",Barlow,system-ui,sans-serif;font-variant-numeric:tabular-nums;margin-top:6px}
.sc .sn small{font-size:18px;margin-left:1px}
.sc .sn small.pre{margin:0 5px 0 0;font-size:15px;color:var(--mu)}
.sc .st{font-size:14px;color:var(--mu);line-height:1.3;flex:1}
.sc .meter{height:6px;margin-top:10px}
.sc .go{position:absolute;top:9px;right:12px;font-size:20px;line-height:1;color:var(--mu);transition:transform .18s,color .18s}
.sc:hover .go{transform:translateX(3px);color:var(--tl)}
.sc.fleet{grid-column:1/-1;flex-direction:row;align-items:center;gap:16px;padding:16px}
.sc.fleet .ring{width:108px;height:108px}
.sc.fleet .rc span{font-size:11px}
.sc.fleet .fk{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.sc.fleet .st{flex:none;color:var(--tl);font-weight:600}
.upd.foot{margin:16px 2px 0;font-size:14px}
@media (max-width:360px){.sc.fleet{flex-direction:column;align-items:stretch}.sc.fleet .ring{align-self:center}}
@media (min-width:900px){
  .hero{min-height:480px;padding:26px 26px 22px}
  .hero h2{font-size:40px}
  .hero form{max-width:520px}
  .hgrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .sc{padding:16px 16px 14px}
  .sc.fleet{grid-column:span 2;grid-row:span 2;gap:26px;padding:24px}
  .sc.fleet .ring{width:176px;height:176px}
  .sc.fleet .rc b{font-size:52px}
  .sc.fleet .rc small{font-size:22px}
  .sc.fleet .rc span{font-size:14px}
  .sc.fleet .kpis b{font-size:36px}
  .banner{height:380px}
  .igrid{align-items:stretch}
}

/* ---------- page furniture ---------- */
.phead{margin:2px 0 14px}
.phead h2{font-size:28px;line-height:1.15;margin:0 0 4px;text-wrap:balance}
.phead p{margin:0;color:var(--mu);max-width:68ch}
.topics{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.topics a{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);color:inherit;font-weight:600;font-size:15px;text-decoration:none;transition:background .2s,color .2s,border-color .2s,transform .12s}
.topics a:hover{border-color:var(--tl)}
.topics a:active{transform:scale(.97)}
.topics a[aria-current="page"]{background:var(--tl);border-color:var(--tl);color:var(--otl)}
.kstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:0 0 12px}
.kstrip>div{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;box-shadow:var(--sh);min-width:0;animation:rise .4s backwards}
.kstrip b{display:block;font:700 28px/1.05 "Barlow Semi Condensed",Barlow,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.kstrip span{font-size:13px;color:var(--mu);line-height:1.25;display:block;margin-top:2px}
.kstrip .k-bad b{color:var(--bd)}.kstrip .k-warn b{color:var(--wn)}.kstrip .k-ok b{color:var(--ok)}
.sech{display:flex;align-items:baseline;gap:8px;margin:22px 0 8px;scroll-margin-top:calc(70px + env(safe-area-inset-top,0px))}
.sech h3{font-size:19px;margin:0}
.sech small{color:var(--mu);font-size:14px}
.asec{scroll-margin-top:calc(70px + env(safe-area-inset-top,0px))}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.filters button{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);font-weight:600;font-size:15px;cursor:pointer;transition:background .2s,color .2s,border-color .2s,transform .12s}
.filters button small{font-weight:500;opacity:.75;margin-left:2px}
.filters button:hover{border-color:var(--tl)}
.filters button[aria-pressed="true"]{background:var(--tl);border-color:var(--tl);color:var(--otl)}
.filters button:active,.qc:active,.btn:active,.tabs button:active,.seg button:active{transform:scale(.97)}
.seg.sm{display:inline-flex;flex-wrap:nowrap;gap:0;margin:0;border:1px solid var(--ln);border-radius:10px;overflow:hidden;background:var(--sf)}
.seg.sm button{flex:none;min-width:0;min-height:38px;padding:0 14px;border:0;border-radius:0;font-size:14px;background:transparent}
.seg.sm button[aria-pressed="true"]{border:0;background:var(--tl);color:var(--otl)}
.cbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin:0 0 12px}
.key{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:13px;color:var(--mu)}
.key i{width:14px;height:4px;border-radius:2px;margin-left:6px}
.key i:first-child{margin-left:0}
.find-in{display:flex;align-items:center;gap:8px;background:var(--sf);border:2px solid var(--ln);border-radius:12px;padding:0 12px;min-height:48px;margin:0 0 10px;max-width:420px}
.find-in:focus-within{border-color:var(--tl)}
.find-in svg{width:20px;height:20px;fill:none;stroke:var(--mu);stroke-width:2;stroke-linecap:round;flex:none}
.find-in input{flex:1;min-width:0;border:0;background:transparent;font-size:17px;padding:8px 0}
.find-in input:focus{outline:0}

/* rows: one crane or one job per line */
.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:2px 12px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 12px 10px 14px;color:inherit;text-decoration:none;box-shadow:var(--sh);transition:transform .18s,border-color .18s;animation:rise .35s backwards}
.row:hover{transform:translateY(-1px);border-color:var(--tl)}
.row.bad{border-left:4px solid var(--bd)}
.row.warn{border-left:4px solid var(--wn)}
.row .rid{font:700 20px/1.1 "Barlow Semi Condensed",Barlow,system-ui,sans-serif;min-width:48px}
.row .rb{min-width:0}
.row .rm{margin:0;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.row .rs{margin:2px 0 0;color:var(--mu);font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.row .rv{font:700 17px "Barlow Semi Condensed",Barlow,system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .go{font-size:24px;color:var(--mu);transition:transform .18s,color .18s}
.row:hover .go{transform:translateX(3px);color:var(--tl)}

/* insight cards and charts */
.igrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px;align-items:start}
.igrid .card{margin:0;min-width:0;animation:rise .4s backwards}
.igrid .wide{grid-column:1/-1}
.ins .sub{margin:-2px 0 12px;color:var(--mu);font-size:14px}
.ins h4{font:600 14px Barlow,system-ui,sans-serif;margin:16px 0 8px;color:var(--mu)}
.ins .cap{margin:10px 0 0;font-size:14px;color:var(--mu)}
.vbars{display:flex;align-items:flex-end;gap:5px;height:170px;padding-top:18px;border-bottom:1px solid var(--ln);margin-bottom:24px}
.vbars.yr{margin-bottom:36px}
.vb{flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.vb b{font:600 12px Barlow,system-ui,sans-serif;color:var(--mu);font-variant-numeric:tabular-nums;margin-bottom:3px}
.vb i{display:block;width:100%;max-width:44px;height:var(--h);min-height:2px;background:var(--tl);border-radius:5px 5px 0 0;transform-origin:bottom;animation:growy .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*40ms + .1s);position:relative;overflow:hidden}
.vb i.s-bd{background:var(--bd)}.vb i.s-wn{background:var(--wn)}
.vb.cur i{background:repeating-linear-gradient(135deg,var(--wn) 0 6px,transparent 6px 10px),var(--wnb);box-shadow:inset 0 0 0 1px var(--wn)}
.vb i.st u{position:absolute;left:0;right:0;top:0;display:block}
.vb span{position:absolute;top:calc(100% + 5px);left:50%;transform:translateX(-50%);font-size:12px;line-height:1.15;color:var(--mu);text-align:center;white-space:nowrap}
.vb span small{display:block;font-size:10px;opacity:.85}
.vbars.dense{gap:3px}
.vbars.dense .vb span{font-size:10px}
.vbars.dense .vb b{font-size:11px}
.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-bottom:10px}
.money b{display:block;font:700 22px/1.1 "Barlow Semi Condensed",Barlow,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.money span{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--mu)}
.money span i{width:8px;height:8px;border-radius:2px;flex:none}
.hbars{display:grid;gap:9px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n v" "m m";gap:3px 10px;font-size:14px;color:inherit;text-decoration:none}
.hb>span{grid-area:n;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb>span b{font:700 16px "Barlow Semi Condensed",Barlow,system-ui,sans-serif;margin-right:4px}
.hb>span small{color:var(--mu);margin-left:4px}
.hb>b{grid-area:v;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.hb .meter{grid-area:m;height:8px}
a.hb{border-radius:6px;transition:transform .15s}
a.hb:hover{transform:translateX(3px)}
.ropes{display:grid;gap:10px}
.rp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"id n v" "m m m" "s s s";gap:3px 10px;align-items:baseline;color:inherit;text-decoration:none;border-radius:8px;transition:transform .15s}
.rp:hover{transform:translateX(3px)}
.rp b{grid-area:id;font:700 18px "Barlow Semi Condensed",Barlow,system-ui,sans-serif}
.rp .rn{grid-area:n;color:var(--mu);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp .rv{grid-area:v;font-weight:600;font-variant-numeric:tabular-nums}
.rp .meter{grid-area:m;height:8px}
.rp small{grid-area:s;color:var(--mu);font-size:12px;font-variant-numeric:tabular-nums}
.tm{display:flex;align-items:center;gap:8px;min-width:110px;font-variant-numeric:tabular-nums}
.tm .meter{flex:1;height:8px;min-width:48px}
.gauge{margin:4px 0 10px}
.steps{margin:0;padding-left:20px;display:grid;gap:8px;max-width:60ch}
.steps b{font-weight:600}
.read dd small{display:block;color:var(--mu);font-size:13px;line-height:1.3}
.read dd b{font:700 18px "Barlow Semi Condensed",Barlow,system-ui,sans-serif;font-variant-numeric:tabular-nums}

/* crane chips (PM this month, upcoming inspections) */
.pg+.pg{margin-top:14px}
.cchips{display:flex;flex-wrap:wrap;gap:6px}
.cchip{display:inline-flex;align-items:baseline;gap:6px;min-height:36px;padding:5px 10px;border-radius:9px;border:1px solid var(--ln);background:var(--bg);color:inherit;text-decoration:none;font:700 16px "Barlow Semi Condensed",Barlow,system-ui,sans-serif;transition:border-color .15s,transform .12s}
.cchip small{font:500 12px Barlow,system-ui,sans-serif;color:var(--mu)}
.cchip:hover{border-color:var(--tl)}
.cchip:active{transform:scale(.96)}
.cchip.dn{border-color:var(--bd);color:var(--bd)}

/* PM matrix: every crane by month */
.mx{columns:3 290px;column-gap:30px;margin-top:14px}
.mxg{break-inside:avoid;margin:0 0 16px}
.mxg h4{margin:0 0 4px;color:var(--ink);font:700 15px "Barlow Semi Condensed",Barlow,system-ui,sans-serif}
.mxg h4 small{font:500 12px Barlow,system-ui,sans-serif;color:var(--mu)}
.mxh,.mxr{display:grid;grid-template-columns:46px repeat(12,minmax(0,1fr));gap:3px;align-items:center}
.mxh{font-size:11px;color:var(--mu);text-align:center;margin-bottom:2px}
.mxr{color:inherit;text-decoration:none;padding:2px 0;border-radius:6px}
.mxr:hover{background:var(--bg)}
.mxr b{font:700 15px "Barlow Semi Condensed",Barlow,system-ui,sans-serif}
.mxr i{height:16px;border-radius:3px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--ln)}
.mxr .t-done{background:var(--ok);box-shadow:none}
.mxr .t-plan{background:var(--wn);box-shadow:none}
.mxr .t-pend{background:var(--wnb);box-shadow:inset 0 0 0 1px var(--wn)}
.mxr .t-down{background:var(--bd);box-shadow:none}

/* tables that turn into labelled cards on a phone */
.rtb{width:100%;border-collapse:collapse;font-size:15px}
.rtb th,.rtb td{padding:10px 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rtb th{white-space:normal;vertical-align:bottom;line-height:1.2}
.rtb tbody tr{transition:background .15s}
.rtb tbody tr:hover{background:var(--bg)}
.cid{font:700 17px "Barlow Semi Condensed",Barlow,system-ui,sans-serif;color:inherit;text-decoration:none;border-bottom:2px solid var(--tl)}
@media (max-width:1023px){
  .rtb thead{display:none}
  .rtb,.rtb tbody{display:block}
  .rtb tr{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px 14px;padding:12px 0;border-top:1px solid var(--ln)}
  .rtb tbody tr:first-child{border-top:0}
  .rtb td{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:0;border:0;white-space:normal;min-width:0}
  .rtb td .tm{align-self:stretch}
  .rtb td::before{content:attr(data-l);font-size:12px;color:var(--mu);font-weight:500}
  .rtb td:first-child{grid-column:1/-1;font-size:17px}
  .rtb td:first-child::before{display:none}
  .rtb .tm{min-width:0}
}
.qt{font-size:15px}
.qt th,.qt td{padding:8px 6px}

/* ---------- Cranes: tiles ---------- */
.fl-h{display:flex;align-items:center;gap:8px;font-size:19px;margin:20px 0 8px}
.fl-h small{font:600 13px Barlow,system-ui,sans-serif;color:var(--mu);background:var(--sf);border:1px solid var(--ln);border-radius:999px;padding:1px 9px}
.qc{position:relative;overflow:hidden;box-shadow:var(--sh);transition:transform .18s,border-color .18s;animation:rise .45s backwards;animation-delay:calc(var(--i,0)*12ms)}
.qc::before{content:"";position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--okb)}
.qc::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--ln)}
.qc.down{border-color:var(--bd)}
.qc.down::before{background:var(--bd);box-shadow:0 0 0 3px var(--bdb);animation:blink 1.4s infinite}
.qc:hover{transform:translateY(-2px);border-color:var(--tl)}
.qc.pm-done::after,.key .pm-done{background:var(--ok)}
.qc.pm-plan::after,.key .pm-plan{background:var(--wn)}
.qc.pm-pend::after,.key .pm-pend{background:var(--ln)}
@media (min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}}

/* ---------- one crane ---------- */
.tabs{position:static;flex-wrap:wrap;overflow:visible;margin:0 0 14px;padding:0;gap:6px}
.tabs button{flex:1 1 auto;min-height:42px;padding:0 12px}
#panel>*{animation:rise .35s backwards}
#panel>*:nth-child(2){animation-delay:.04s}#panel>*:nth-child(3){animation-delay:.08s}#panel>*:nth-child(4){animation-delay:.12s}#panel>*:nth-child(n+5){animation-delay:.16s}
#detail:not([hidden]) #dhead{animation:rise .4s backwards}
.tl{list-style:none;display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:4px 0 12px;padding:0}
.tl li{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mu)}
.tl i{width:100%;max-width:26px;height:10px;border-radius:3px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--ln)}
.tl .t-done i{background:var(--ok);box-shadow:none}
.tl .t-plan i{background:var(--wn);box-shadow:none}
.tl .t-pend i{background:var(--wnb);box-shadow:inset 0 0 0 1px var(--wn)}
.tl .t-down i{background:var(--bd);box-shadow:none}
@media (min-width:900px){
  #panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;align-items:start}
  #panel>.card{margin:0}
  #panel>.seg,#panel>.more,#panel>.note,#panel>.empty{grid-column:1/-1;margin-bottom:0}
}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.35}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes ring{from{stroke-dashoffset:var(--c)}}
.still *,.still *::before,.still *::after{animation:none!important}
::view-transition-old(root),::view-transition-new(root){animation-duration:.26s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

const ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const P=(d,to,fn)=>({d,to:to||{},fn});
function cycle(){return[
  P(3.4,{tz:ZS,sy:SAFE,tx:0}),P(2.4,{sy:SHIP_TOP}),P(.5,{},()=>st.carry='crane'),P(2.4,{sy:SAFE}),
  P(3.6,{tz:ZL}),P(2.4,{sy:TRUCK_TOP}),P(.5,{},()=>st.carry='truck'),P(2,{sy:SAFE}),
  P(4.6,{tx:140}),P(0,{tx:-140},()=>{boxMat.color.setHex(BOXC[(Math.random()*BOXC.length)|0])}),
  P(4.6,{tx:0}),P(2.4,{sy:TRUCK_TOP}),P(.5,{},()=>st.carry='crane'),P(2.4,{sy:SAFE}),
  P(3.6,{tz:ZS}),P(2.4,{sy:SHIP_TOP}),P(.5,{},()=>st.carry='ship'),P(2.2,{sy:SAFE}),
  P(4.6,{tx:140}),P(0,{tx:-140})

function step(dt){
  if(!ph){
    if(!queue.length){if(mode==='work')queue=cycle();else return}
    ph=queue.shift();ph.el=0;ph.from={};for(const k in ph.to)ph.from[k]=st[k];
  }
  ph.el+=dt;const p=ph.d?Math.min(1,ph.el/ph.d):1,e=ease(p);
  for(const k in ph.to)st[k]=ph.from[k]+(ph.to[k]-ph.from[k])*e;

}

<script>
/* ===== QC Dashboard Status: state, storage and shared calculations ===== */
let D=null,IDS=[],FCACHE=null;
function useData(d){D=d&&d.qcs?d:null;IDS=D?Object.keys(D.qcs):[];FCACHE=null}
/* Saved data: the latest uploaded live update file, kept in this browser (IndexedDB, localStorage fallback). */
const DB={
  open(){return new Promise((ok,no)=>{if(!window.indexedDB)return no(new Error('no idb'));const r=indexedDB.open('qc-lookup',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})},
  async get(){return Promise.race([DB._get(),new Promise(r=>setTimeout(()=>r(null),4000))])},
  async _get(){try{const db=await DB.open();const v=await new Promise((ok,no)=>{const q=db.transaction('kv').objectStore('kv').get('data');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});if(v)return v}catch(_){}
    try{return JSON.parse(localStorage.getItem('qcD')||'null')}catch(_){return null}},
  async set(d){return Promise.race([DB._set(d),new Promise(r=>setTimeout(()=>r(false),4000))])},
  async _set(d){let ok1=false;try{const db=await DB.open();await new Promise((ok,no)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(d,'data');t.oncomplete=ok;t.onerror=()=>no(t.error)});ok1=true}catch(_){}
    try{localStorage.setItem('qcD',JSON.stringify(d))}catch(_){try{localStorage.removeItem('qcD')}catch(_){}}
    return ok1}
};
/* Shared mode (claude.ai): one upload is stored in the page's shared storage and every viewer loads it. */
const SH={db:null,assets:null,cur:null,loading:null,got:false};
const canUp=()=>!SH.db||!!SH.assets;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const E=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(+n).padStart(2,'0');
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MN={Jan:'January',Feb:'February',Mar:'March',Apr:'April',May:'May',Jun:'June',Jul:'July',Aug:'August',Sep:'September',Oct:'October',Nov:'November',Dec:'December'};
const T=new Date(),T0=new Date(T.getFullYear(),T.getMonth(),T.getDate()),ISO=T.getFullYear()+'-'+pad(T.getMonth()+1)+'-'+pad(T.getDate());
const RX=/^(\d{4})-(\d\d)-(\d\d)$/,isIso=s=>RX.test(s||'');
const fd=s=>{const m=RX.exec(s||'');return m?(+m[3])+' '+MON[+m[2]-1]+' '+m[1]:E(s)};
const fdd=s=>{const m=RX.exec(s||'');return m?(+m[3])+' '+MON[+m[2]-1]:E(s)};
/* Whole days from today to a date: negative is in the past. */
const dayDiff=s=>{const m=RX.exec(s||'');return m?Math.round((new Date(+m[1],+m[2]-1,+m[3])-T0)/864e5):null};
const ago=s=>{const d=dayDiff(s);return d===null?'':d<0?(-d)+' days ago':d===0?'today':'in '+d+' days'};
const YR=()=>String((D&&D.year)||String((D&&D.built)||'').slice(0,4)||T.getFullYear());
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const tone=t=>/long down|exceed|reject|expired|overdue|not avail/i.test(t)?'bad':/^ops$|complete|done|closed|available|valid/i.test(t)?'ok':/open|pend|wait|due|progress|partial|sched|plan/i.test(t)?'warn':'';
const chip=(t,x)=>t?'<span class="chip '+(x||tone(t))+'">'+E(t)+'</span>':'';
const kv=(k,v)=>v?'<div class="kv"><dt>'+k+'</dt><dd>'+v+'</dd></div>':'';
const dl=(...r)=>'<dl>'+r.join('')+'</dl>';
const empty=t=>'<p class="empty">'+t+'</p>';
const num=v=>{const s=String(v==null?'':v).trim();return /^-?[\d,]+(\.\d+)?$/.test(s)?parseFloat(s.replace(/,/g,'')):null};
const nf=v=>Number(v).toLocaleString('en-US');
const myr=x=>/MYR/i.test(x.rm||'')?(num(String(x.rm).replace(/MYR/i,''))||0):0;
const fmtM=v=>'MYR '+(v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?Math.round(v/1e3)+'k':Math.round(v));

/* ---------- per-crane helpers ---------- */

const cat=x=>/complete|clos|done/i.test(x.st)?'done':isOpen(x)?'open':'other';
/* Work requests: criticality comes from the Priority column (Priority 1 is most critical). */
const wqOf=c=>c.wq||[];

const critLbl=x=>{const n=crit(x);return n<9?'P'+n+(/minor/i.test(x.pri)?' · Minor':/major/i.test(x.pri)?' · Major impact':''):(x.pri||'')};
const critTone=n=>n===1?'bad':n===2?'warn':'ok';
const wqOpen=x=>!/clos|cancel|complet|reject/i.test(x.st||'');

const pmState=x=>!x?'none':/complete|done/i.test(x.s)?'done':/plan|progress|partial|sched/i.test(x.s)?'plan':'pend';
/* A month cell: PM done wins, then crane down, then the PM state. */
const cellState=x=>{const s=pmState(x);return s==='done'?'done':/down/i.test(x&&x.st||'')?'down':s};
const CELL={done:'PM done',plan:'In plan',pend:'Not done',none:'No record',down:'Crane down'};
const curMon=()=>{const has=new Set();IDS.forEach(i=>D.qcs[i].pm.forEach(x=>has.add(MON.indexOf(x.m))));const a=[...has].filter(k=>k>=0).sort((x,y)=>x-y);if(!a.length)return null;
  if(+YR()===T.getFullYear()){const b=a.filter(k=>k<=T.getMonth());return MON[b.length?b[b.length-1]:a[0]]}return MON[a[a.length-1]]};

const downSince=c=>{let k=null,on=false;for(let i=c.pm.length-1;i>=0;i--){const x=c.pm[i];if(!on&&!(x.st||x.s||x.a.length))continue;on=true;if(/down/i.test(x.st))k=x.m;else break}return k};

const pmaDays=c=>dayDiff(c.pmaExp);

/* Quarterly inspection: the latest quarter with an actual date, and its next plan date. */
const inspNext=c=>{const l=[...(c.fyk||[])].reverse().find(x=>x.a);return l?{q:l.q,a:l.a,n:l.n,d:dayDiff(l.n)}:null};
/* Wirerope */
const ropeType=j=>{const s=String(j||'').toUpperCase();return /CATENARY/.test(s)?'Catenary':/TROLLEY/.test(s)?'Trolley':/BOOM/.test(s)?'Boom':/HOIST/.test(s)?'Main hoist':'Other'};
const ropeTone=p=>p>=100?'s-bd':p>=90?'s-wn':'s-tl';
const sanyOf=c=>Array.isArray(c.sany)?c.sany:c.sany?[{ty:'',lim:'',st:c.sany.st,d:'',mv:'',item:c.sany.item,cur:num(c.sany.cur)!==null?c.sany.cur:''}]:[];
/* Oil: "OIL SAMPLING : <parts> OIL REPLACEMENT : <parts>" */
const oilParts=ds=>{const m=/OIL\s+SAMPLING\s*:?\s*(.*?)\s*OIL\s+REPLACEMENT\s*:?\s*(.*)$/i.exec(ds||''),sp=s=>String(s||'').toUpperCase().split(/[\/,&+]|\bAND\b/).map(x=>x.replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim()).filter(x=>x&&x.length<=24);
  return m?{sa:sp(m[1]),re:sp(m[2])}:{sa:[],re:[]}};
const oilDate=x=>isIso(x.c)?x.c:isIso(x.d)?x.d:'';

/* ---------- fleet-wide numbers, computed once per data load ---------- */
function FC(){
  if(FCACHE)return FCACHE;
  const f={};f.all=IDS.map(i=>D.qcs[i]);f.N=IDS.length;f.m=curMon();
  f.down=IDS.filter(i=>isDown(D.qcs[i]));f.ops=f.all.filter(c=>/^ops$/i.test(stOf(c))).length;

function vWQ(){

  if(!q.length)return topics('work-requests')+phead('Work requests','')+noData('The file has no WORK REQUEST sheet, or it has no rows.');
  const by={};q.forEach(x=>{if(!isIso(x.d))return;const k=x.d.slice(0,7);(by[k]=by[k]||{o:0,c:0})[wqOpen(x)?'o':'c']++});
  const wm=Object.keys(by).sort().slice(-14),wmax=Math.max(1,...wm.map(k=>by[k].o+by[k].c));
  const ages=o.filter(x=>isIso(x.d)).map(x=>Math.max(0,-dayDiff(x.d)));
  const B=[['30 days or less',0,30],['31 to 90 days',31,90],['91 to 180 days',91,180],['181 to 365 days',181,365],['More than a year',366,1e9]].map(([l,a,b],i)=>({l,v:ages.filter(v=>v>=a&&v<=b).length,c:i>2?'s-bd':i>0?'s-wn':'s-tl'}));
  const pc={};o.forEach(x=>{pc[x.id]=(pc[x.id]||0)+1});const topc=Object.entries(pc).sort((a,b)=>b[1]-a[1]||(+a[0].slice(1)-+b[0].slice(1))).slice(0,8);
  const ty={};o.forEach(x=>{const k=x.ty||'No type';ty[k]=(ty[k]||0)+1});
  const list=o.filter(x=>UI.wqf==='all'||crit(x)===+UI.wqf).sort((a,b)=>(crit(a)-crit(b))||String(a.d).localeCompare(String(b.d)));

   +kstrip([[nf(q.length),'Total',''],[nf(o.length),'Open','warn'],[nf(q.length-o.length),'Closed','ok'],[f.wc[0],'Open at P1',f.wc[0]?'bad':'']])
   +'<div class="igrid">'
   +card('Raised per month',wm.length?'From '+MN[MON[+wm[0].slice(5)-1]]+' '+wm[0].slice(0,4):'',vbars(wm.map((k,i)=>{const a=by[k].o,c=by[k].c;return{top:a+c,h:(a+c)/wmax*100,cl:'st',inn:'<u class="s-wn" style="height:'+(a/(a+c)*100).toFixed(1)+'%"></u>',l:mlab(k,i),t:MN[MON[+k.slice(5)-1]]+' '+k.slice(0,4)+': '+(a+c)+' raised, '+a+' still open'}}),'Work requests raised per month','yr')+lg([['Closed','','s-tl'],['Still open','','s-wn']]))
   +card('Open requests','By criticality, type and age',
      '<div class="rt"><span>Criticality</span><b>'+o.length+' open</b></div>'+seg([[f.wc[0],'s-bd'],[f.wc[1],'s-wn'],[f.wc[2]+f.wc[3],'s-ok']],o.length)+lg([['P1',f.wc[0],'s-bd'],['P2',f.wc[1],'s-wn'],['P3',f.wc[2],'s-ok']].concat(f.wc[3]?[['No priority',f.wc[3],'s-mu']]:[]))
     +'<h4>Type</h4>'+hbars(Object.entries(ty).sort((a,b)=>b[1]-a[1]).map(([l,v])=>({l:E(l),v})))
     +'<h4>Age of open requests</h4>'+hbars(B)+(oldest?'<p class="cap">Oldest open request: '+E(oldest.no)+' on '+oldest.id+', raised '+fd(oldest.d)+'.</p>':''))

   +'</div>'

/* ---------- Insights: PR / WO ---------- */
/* Group vendor names that are the same company written differently: short name vs full name, initials, spacing, case, one-letter typos. */
function vendorGroups(jobs){
  const raw=new Map();jobs.forEach(o=>{const n=(o.x.v||'').trim();if(!n)return;const r=raw.get(n)||{name:n,n:0,v:0};r.n++;r.v+=myr(o.x);raw.set(n,r)});
  const it=[...raw.values()].map(r=>{const u=r.name.toUpperCase().replace(/\s*&\s*/g,'&').replace(/[.,()]/g,' ').replace(/\s+/g,' ').trim(),core=u.replace(/\b(SDN|BHD|M)\b/g,' ').replace(/\s+/g,' ').trim(),w=core.split(' ').filter(Boolean);
    return Object.assign(r,{w,key:core.replace(/&/g,'N').replace(/ /g,''),ini:w.length>1?w.map(x=>x[0]).join(''):'',iniAll:u.split(' ').filter(Boolean).map(x=>x[0]).join('')})});
  const par=it.map((_,i)=>i),find=i=>par[i]===i?i:(par[i]=find(par[i]));
  const lev1=(a,b)=>{const la=a.length,lb=b.length;if(Math.abs(la-lb)>1)return false;let i=0,j=0,e=0;while(i<la&&j<lb){if(a[i]===b[j]){i++;j++}else{if(++e>1)return false;if(la>lb)i++;else if(lb>la)j++;else{i++;j++}}}return e+(la-i)+(lb-j)<=1};
  for(let a=0;a<it.length;a++)for(let b=a+1;b<it.length;b++){const A=it[a],B=it[b],S=A.key.length<=B.key.length?A:B,L=S===A?B:A;
    const same=A.key===B.key||(S.w.length===1&&L.w.length>1&&(L.w[0]===S.w[0]||L.ini===S.key||L.iniAll===S.key))||(S.key.length>=7&&A.w.length===1&&B.w.length===1&&lev1(A.key,B.key));
    if(same)par[find(a)]=find(b)}
  const g=new Map();it.forEach((r,i)=>{const k=find(i);(g.get(k)||g.set(k,[]).get(k)).push(r)});
  return [...g.values()].map(a=>{a.sort((x,y)=>y.n-x.n);return{name:a[0].name,names:a.map(x=>x.name),n:a.reduce((s,x)=>s+x.n,0),v:a.reduce((s,x)=>s+x.v,0)}}).sort((a,b)=>b.v-a.v);
}
function vPR(){
  const f=FC(),Y=YR(),J=f.jobs;
  if(!J.length)return topics('pr-wo')+phead('PR / WO','')+noData('The file has no PR sheet, or it has no rows.');
  const dv=f.jv.done||0,nv=f.jv.none||0,tot=dv+f.jopenV+nv||1;
  const stc={};f.jopen.forEach(o=>{const k=cap(o.x.st);stc[k]=(stc[k]||0)+1});
  const psc={};f.jopen.forEach(o=>{const k=o.x.ps?cap(o.x.ps):'No PR / PO status';psc[k]=(psc[k]||0)+1});
  const vg=vendorGroups(J.filter(o=>o.g!=='cancel')),merged=vg.slice(0,8).filter(x=>x.names.length>1);
  const by={};J.forEach(o=>{const d=o.x.d;if(!isIso(d)||d.slice(0,4)!==Y)return;const k=d.slice(0,7);(by[k]=by[k]||{o:0,c:0})[o.g==='done'?'c':isOpen(o.x)?'o':'x']++});
  const pm=Object.keys(by).sort(),pmax=Math.max(1,...pm.map(k=>by[k].o+by[k].c));
  const yr={};f.jopen.forEach(o=>{const m=/20\d\d/.exec(o.x.d||'');const k=m?m[0]:'No date';yr[k]=(yr[k]||0)+1});
  const big=f.jopen.filter(o=>myr(o.x)>0).sort((a,b)=>myr(b.x)-myr(a.x));
  const topc=IDS.map(i=>({i,n:D.qcs[i].pr.filter(isOpen).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n||(+a.i.slice(1)-+b.i.slice(1))).slice(0,8);
  const ids=o=>o.ids.slice(0,3).join(', ')+(o.ids.length>3?' +'+(o.ids.length-3):'');
  return topics('pr-wo')+phead('PR / WO','Purchase requests and work orders. Open means not completed and not cancelled. A job listed against several cranes is counted once.')
   +kstrip([[nf(J.length),'Jobs',''],[nf(f.jopen.length),'Open','warn'],[nf(f.jg.done||0),'Completed','ok'],[fmtM(f.jopenV),'Open value','warn']])
   +'<div class="igrid">'
   +card('Value by status','Sum of the RM column',
      '<div class="money"><div><b>'+fmtM(dv)+'</b><span><i class="s-ok"></i>Completed</span></div><div><b>'+fmtM(f.jopenV)+'</b><span><i class="s-wn"></i>Open</span></div>'+(nv?'<div><b>'+fmtM(nv)+'</b><span><i class="s-mu"></i>No status</span></div>':'')+'</div>'+seg([[dv,'s-ok'],[f.jopenV,'s-wn'],[nv,'s-mu']],tot)
     +'<h4>Open jobs by job status</h4>'+hbars(Object.entries(stc).sort((a,b)=>b[1]-a[1]).map(([l,v])=>({l:E(l),v})),null,'s-wn')

 } else say(sum+(saved?' Saved on this device.':' Could not save it on this device; it will be gone after you close the page.')+warn,saved&&d.pmRows?'ok':'bad');
});
async function shared(){
  if(!window.claude||!window.claude.use)return;
  let db=null;try{db=await window.claude.use('db')}catch(_){}
  if(!db)return;
  SH.db=db;try{SH.assets=await window.claude.use('assets')}catch(_){}
  if(!SH.assets)say('Only people with edit access to this page can upload. You see the latest file they uploaded.');
  route(false);
  const tm=setTimeout(()=>{if(!SH.got)say('Can\'t reach the shared data yet.'+(D?' Showing the copy saved on this device.':''),'bad')},10000);
  db.doc('live/current').onSnapshot(async s=>{
    if(!s.metadata.fromCache&&!SH.got){SH.got=true;clearTimeout(tm)}
    if(!s.exists){SH.cur=null;return}
    const m=s.data();SH.cur=m;
    if((D&&D.at===m.at&&D.src===m.src)||SH.loading===m.at)return;
    SH.loading=m.at;
    try{const r=await fetch('/_blob/'+m.asset);if(!r.ok)throw 0;const d=await r.json();if(!d||!d.qcs)throw 0;
      if(SH.cur!==m)return;useData(d);DB.set(d);route(false);
      if(!SH.assets)say('Updated to '+d.src+'.','ok');else if(MSG.k==='bad'&&/shared data/i.test(MSG.t))say('','')}
    catch(_){SH.loading=null;say('Could not load the latest shared data. Reload the page to try again.','bad')}
  },()=>{clearTimeout(tm);SH.got=true;say('Shared data is unavailable right now.'+(D?' Showing the copy saved on this device.':''),'bad')});
}
/* ===== router, navigation, events, theme ===== */
const VIEWS={attention:vAttention,pm:vPM,'work-requests':vWQ,'pr-wo':vPR,wirerope:vRope,certificates:vCert,oil:vOil,fleets:vFleets,cranes:vCranes,data:vData};
const isTopic=k=>TOPICS.some(t=>t[0]===k);
let page='home',lastTopic='pm',fromPage='home';const SCR={};
function renderView(anim){
  const el=$('#view');el.classList.toggle('still',!anim);
  if(!D&&page!=='data'){el.innerHTML=phead('No data loaded yet','')+'<article class="card empty-state"><p>Open the Data page to upload the latest LIVE UPDATE file.</p><div class="tools"><a class="btn pri" href="#data">Go to Data</a></div></article>';return}
  el.innerHTML=VIEWS[page]();
  if(page==='cranes')cranesList();
}
/* nav=true when the address changed; false when the same page is redrawn with new data. */
function route(nav){
  const raw=decodeURIComponent(location.hash.slice(1)),key=raw.toLowerCase(),id=raw.toUpperCase(),prev=page;
  if(nav)SCR[prev]=window.scrollY;
  const isCrane=!!(D&&D.qcs[id]);
  page=isCrane?'crane':VIEWS[key]?key:'home';
  if(isTopic(page))lastTopic=page;
  if(page==='crane'&&prev!=='crane')fromPage=prev;
  $('#home').hidden=page!=='home';$('#view').hidden=page==='home'||page==='crane';$('#detail').hidden=page!=='crane';
  if(page==='home'){renderHome();gl('#hero','#gl1',{id:'QC',sub:'Quay crane',down:false})}
  else if(page==='crane'){
    if(nav||cur!==id){cur=id;tab='sum';prAll=D.qcs[id].pr.some(x=>cat(x)==='open')?'open':'all';prN=40;wqAll=wqOf(D.qcs[id]).some(wqOpen)?'open':'all';wqN=40;oilN=8}
    $('#q').value='';$('#sug').innerHTML='';$('#homebody').hidden=false;
    head();draw()}
  else renderView(nav);
  /* header and navigation state */
  const n=page==='home'?'home':page==='attention'?'attention':isTopic(page)?'insights':page==='data'?'data':'cranes';
  $$('#nav a').forEach(a=>{if(a.dataset.n===n)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('#nins').setAttribute('href','#'+lastTopic);
  const b=$('#nbadge'),k=D?alertCounts().bad:0;b.textContent=k;b.hidden=!k;
  $('#back').hidden=page!=='crane';
  $('.bar h1').textContent=page==='crane'?cur+' · '+(D.qcs[cur].fleet||'Crane'):'QC DASHBOARD STATUS';
  if(nav){if(prev==='crane'&&page===fromPage&&SCR[page]!=null)window.scrollTo(0,SCR[page]);else window.scrollTo(0,0)}
}
addEventListener('hashchange',()=>swap(()=>route(true)));
$('#back').addEventListener('click',()=>{location.hash=fromPage==='home'||fromPage==='crane'?'':fromPage});
/* Home search */
function matches(v){
  const n=String(v).toUpperCase().replace(/[^0-9]/g,'').replace(/^0+/,'');
  if(!n)return [];
  const k=i=>String(+i.slice(1));
  return IDS.filter(i=>k(i).includes(n)).sort((a,b)=>(k(b).startsWith(n)-k(a).startsWith(n))||(+a.slice(1)-+b.slice(1))).slice(0,12);
}
$('#q').addEventListener('input',e=>{
  const m=matches(e.target.value),has=!!e.target.value.trim();
  $('#homebody').hidden=has;
  $('#sug').innerHTML=!has?'':!D?empty('Upload the live update file first.'):m.length?m.map(i=>{const c=D.qcs[i];return '<a class="sug" href="#'+i+'"><b>'+i+'</b><span>'+E(c.fleet)+'</span>'+chip(stOf(c))+'</a>'}).join(''):empty('No crane found. Check the number and try again.');
});
$('#f').addEventListener('submit',e=>{e.preventDefault();const m=matches($('#q').value);if(m.length)location.hash=m[0]});
/* One crane: tabs and paging */
$('#detail').addEventListener('click',e=>{
  const t=e.target.closest('[data-t]'),p=e.target.closest('[data-pr]'),w=e.target.closest('[data-wq]');
  if(t){tab=t.dataset.t;draw();const tb=$('#dbody');if(tb.getBoundingClientRect().top<0)tb.scrollIntoView({block:'start'})}
  else if(p){prAll=p.dataset.pr;prN=40;draw()}
  else if(w){wqAll=w.dataset.wq;wqN=40;draw()}
  else if(e.target.id==='moreq'){wqN+=40;draw()}
  else if(e.target.id==='more'){prN+=40;draw()}
  else if(e.target.id==='moreo'){oilN+=16;draw()}
});
/* Pages: filters, paging, jumps and actions are plain data attributes */
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-set]'),m=e.target.closest('[data-more]'),j=e.target.closest('[data-jump]'),a=e.target.closest('[data-act]');
  if(s){const v=s.dataset.set,i=v.indexOf(':'),k=v.slice(0,i);UI[k]=v.slice(i+1);Object.keys(DEF).forEach(x=>{if(/N$/.test(x)&&x!==k)UI[x]=DEF[x]});swap(()=>renderView(false))}
  else if(m){UI[m.dataset.more]+=+m.dataset.step||20;renderView(false)}
  else if(j){const t=document.getElementById(j.dataset.jump);if(t)t.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'})}
  else if(a){if(!D)return;if(a.dataset.act==='exall')xport(IDS,'QC-all-'+D.built+'.xlsx');else if(a.dataset.act==='exone')xport([cur],'QC-'+cur+'-'+D.built+'.xlsx')}
});
document.addEventListener('input',e=>{if(e.target.id==='cq'){UI.cq=e.target.value;cranesList()}});
/* ===== Light / dark mode ===== */
const RT=document.documentElement,isDark=()=>RT.dataset.theme?RT.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
function syncTheme(){const d=isDark();$('#theme').classList.toggle('is-dark',d);$('#thl').textContent=d?'Light':'Dark';$('#theme').setAttribute('aria-pressed',d);if(window.Q3D&&Q3D.setTheme)Q3D.setTheme(d)}
$('#theme').addEventListener('click',()=>{const t=isDark()?'light':'dark';try{localStorage.setItem('qcTheme',t)}catch(_){}swap(()=>{RT.dataset.theme=t;syncTheme()})});
try{const t=localStorage.getItem('qcTheme');if(t==='light'||t==='dark')RT.dataset.theme=t}catch(_){}
new MutationObserver(syncTheme).observe(RT,{attributes:true,attributeFilter:['data-theme']});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncTheme);
/* ===== start ===== */
route(false);syncTheme();
shared();
DB.get().then(s=>{if(s&&s.qcs&&!D){useData(s);route(false)}});
</script>
